name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-fast:
    name: PR fast gate (ubuntu)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ArSclStudio.sln

      - name: Build
        run: dotnet build ArSclStudio.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ArSclStudio.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=normal"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-failure-evidence-ubuntu
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore

  qualification:
    name: Qualification (${{ matrix.os }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ArSclStudio.sln

      - name: Build
        run: dotnet build ArSclStudio.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ArSclStudio.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=normal"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ matrix.os }}
          path: tests/**/TestResults/*.trx
          if-no-files-found: warn

      - name: Publish Windows desktop
        if: runner.os == 'Windows'
        run: dotnet publish src/ArSclStudio.Desktop/ArSclStudio.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/ARSCL-Studio-win-x64

      - name: Upload Windows desktop
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ARSCL-Studio-win-x64
          path: artifacts/ARSCL-Studio-win-x64
