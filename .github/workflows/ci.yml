name: CI

on:
  push:
    branches:
      - main
      - foundation/**
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ArSclStudio.sln

      - name: Build
        run: dotnet build ArSclStudio.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ArSclStudio.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=detailed"


      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ matrix.os }}
          path: tests/**/TestResults/*.trx

      - name: Publish Windows desktop
        if: runner.os == 'Windows'
        run: dotnet publish src/ArSclStudio.Desktop/ArSclStudio.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/ARSCL-Studio-win-x64

      - name: Upload Windows desktop
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ARSCL-Studio-win-x64
          path: artifacts/ARSCL-Studio-win-x64
